<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private RSVP • Giri & Priya</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#513c3b;background:#f9f0e7}
*{box-sizing:border-box}body{margin:0}.wrap{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:32px 0 70px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}h1{font:normal clamp(28px,5vw,44px)/1.13 Georgia,serif;margin:12px 0 8px}h2{font-size:18px}p{line-height:1.5}.muted{color:#756663}
a{color:#953c4a}button{cursor:pointer;border:0;border-radius:12px;background:#8e3448;color:#fff;padding:12px 17px;font-weight:700;min-height:44px}button:hover{background:#702638}button:focus-visible,input:focus-visible{outline:3px solid #d1a86f;outline-offset:2px}
button.secondary{background:#eadbd3;color:#543737}
.panel{background:#fffaf5;border:1px solid #e8d9cd;box-shadow:0 8px 34px #4c231410;padding:clamp(20px,4vw,32px);border-radius:22px}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid #c9aea6;font:inherit;background:#fff}
#login{max-width:470px;margin:60px auto}#status{min-height:24px;color:#a32b39}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.stat{background:#fffaf5;border:1px solid #e8d9cd;border-radius:14px;padding:17px}.stat strong{font-size:clamp(26px,5vw,39px);display:block;color:#903849}.stat span{font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:17px 0}.toolbar input{flex:1 1 200px;width:auto}
.table-wrap{overflow:auto;border:1px solid #e8d9cd;border-radius:16px;background:#fffaf5}table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid #eee0d7;vertical-align:top}th{background:#f3e6db;white-space:nowrap}td.message{max-width:250px;overflow-wrap:anywhere}
#dashboard[hidden],#login[hidden]{display:none}@media(max-width:600px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding-top:18px}}
</style></head>
<body><div class="wrap">
<header><div><small>GIRI & PRIYA • PRIVATE</small><h1>Wedding RSVP Dashboard</h1><p class="muted">Our guest list, kept just for us ♡</p></div><a href="/#rsvp">← Invitation</a></header>
<section id="login" class="panel"><h2>Admin login</h2><p class="muted">Enter your private admin password to view guest responses.</p>
<form id="loginForm"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="1"><p id="status" role="status"></p><button type="submit">Unlock RSVP dashboard</button></form>
</section>
<section id="dashboard" hidden><div class="toolbar"><button class="secondary" id="refresh">Refresh responses</button><button class="secondary" id="export">Export CSV</button><button class="secondary" id="logout">Lock dashboard</button></div>
<p id="notice" role="status" class="muted"></p>
<div class="summary"><div class="stat"><strong id="responses">0</strong><span>Total replies</span></div><div class="stat"><strong id="attending">0</strong><span>Attending guests</span></div><div class="stat"><strong id="yes">0</strong><span>Accepted RSVPs</span></div><div class="stat"><strong id="no">0</strong><span>Declined RSVPs</span></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search guest name, contact, or message" aria-label="Search replies"></div>
<div class="table-wrap"><table><thead><tr><th>Submitted</th><th>Guest</th><th>Reply</th><th>Guests</th><th>Contact</th><th>Message</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</div><script>
(()=>{
const $=id=>document.getElementById(id);let credential='',entries=[];
const endpoint='/.netlify/functions/rsvp-admin';
const text=(id,value)=>$(id).textContent=String(value);
function addCell(tr,value,cls=''){const td=document.createElement('td');td.textContent=String(value||'');td.className=cls;tr.append(td);}
function render(){
const q=$('search').value.trim().toLowerCase();let rows=entries.filter(e=>[e.name,e.contact,e.message].join(' ').toLowerCase().includes(q));
const body=$('rows');body.replaceChildren();
for(const e of rows){const tr=document.createElement('tr');addCell(tr,e.submitted?new Date(e.submitted).toLocaleDateString():'');addCell(tr,e.name);addCell(tr,e.attendance==='yes'?'Attending':e.attendance==='no'?'Not attending':'Unknown');addCell(tr,e.guests);addCell(tr,e.contact);addCell(tr,e.message,'message');body.append(tr);}
if(!rows.length){const tr=document.createElement('tr');const cell=document.createElement('td');cell.colSpan=6;cell.textContent='No matching replies yet.';tr.append(cell);body.append(tr);}
text('responses',entries.length);text('yes',entries.filter(e=>e.attendance==='yes').length);text('no',entries.filter(e=>e.attendance==='no').length);text('attending',entries.reduce((n,e)=>n+(Number(e.guests)||0),0));
}
async function load(){
text('notice','Loading RSVP responses…');
try{const r=await fetch(endpoint,{headers:{Authorization:credential},cache:'no-store'});const data=await r.json();
if(r.status===401){credential='';$('dashboard').hidden=true;$('login').hidden=false;throw Error('Session locked. Enter the admin password.');}
if(!r.ok)throw Error(data.error||'Unable to load submissions');
entries=Array.isArray(data.entries)?data.entries:[];$('login').hidden=true;$('dashboard').hidden=false;render();
text('notice',data.connected?(data.truncated?'Showing the first 5,000 replies.':'Responses updated.'):(data.message||'Automatic sync has not yet been connected.'));
}catch(e){text('notice',e.message);text('status',e.message);}
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const password=$('password').value;credential='Basic '+btoa('admin:'+password);$('password').value='';text('status','');await load();});
$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);
$('logout').addEventListener('click',()=>{credential='';entries=[];$('dashboard').hidden=true;$('login').hidden=false;text('notice','');$('search').value='';});
$('export').addEventListener('click',()=>{
const columns=['submitted','name','attendance','guests','contact','message'];const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';
const csv=[columns.join(','),...entries.map(e=>columns.map(k=>quote(e[k])).join(','))].join('\r\n');
const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='giri-priya-rsvp.csv';a.click();URL.revokeObjectURL(url);
});
})();
</script></body></html>
